<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Hero62: mods, 3D tools, Rust apps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#0E0E11"/>
      <stop offset="0.5" stop-color="#1B1B20"/>
      <stop offset="1" stop-color="#1F1F25"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="260" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <g filter="url(#soft)">
      <ellipse cx="170" cy="220" rx="300" ry="80" fill="#8A8A96" opacity="0.55">
        <animate attributeName="cx" values="170;240;170" dur="18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="420" cy="30" rx="240" ry="55" fill="#6E6E7A" opacity="0.45">
        <animate attributeName="cx" values="420;360;420" dur="24s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1030" cy="70" rx="280" ry="75" fill="#A4A4B0" opacity="0.5">
        <animate attributeName="cx" values="1030;960;1030" dur="20s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="900" cy="240" rx="260" ry="60" fill="#70707C" opacity="0.45">
        <animate attributeName="cy" values="240;215;240" dur="16s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
  <text x="600" y="138" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="72" font-weight="600" letter-spacing="2" fill="#F2F2F4">Hero62</text>
  <text x="600" y="180" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="4" fill="#B4B4BD">mods · 3D tools · Rust apps</text>
</svg>
