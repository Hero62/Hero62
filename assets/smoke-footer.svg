<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="60" viewBox="0 0 1200 60" role="img" aria-label="Decorative smoke footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0B0D"/>
      <stop offset="1" stop-color="#26262C"/>
    </linearGradient>
    <filter id="s" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.03" numOctaves="4" seed="3">
        <animate attributeName="baseFrequency" dur="22s" values="0.004 0.03;0.006 0.036;0.004 0.03" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix type="matrix" values="0 0 0 0 0.75  0 0 0 0 0.75  0 0 0 0 0.8  0 0 0 2.2 -1"/>
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="c"><rect width="1200" height="60" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="60" fill="url(#bg)"/>
    <rect width="1200" height="60" filter="url(#s)" opacity="0.6"/>
  </g>
</svg>
